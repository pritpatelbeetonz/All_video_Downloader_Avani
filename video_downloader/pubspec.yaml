name: video_downloader
description: "A new Flutter module project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  webview_flutter: ^4.13.1
  dio: ^5.9.1
  share_plus: ^10.1.4
  shared_preferences: ^2.5.4
  permission_handler: ^11.0.0
  path_provider: ^2.1.0
  media_store_plus: ^0.1.3
  photo_manager: ^3.0.0
  video_thumbnail: ^0.5.3
  video_player: ^2.11.0
  chewie: ^1.7.5
  http: ^1.6.0
  flutter_html: ^3.0.0
  image_picker: ^1.2.1
  url_launcher: ^6.3.2
  flutter_secure_storage: ^9.2.4
  in_app_review: ^2.0.9
  google_mobile_ads: ^5.2.0
  firebase_remote_config: ^5.1.3
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3
  firebase_core: ^3.6.0
  purchases_flutter:
  connectivity_plus: ^6.0.5
  shimmer: ^3.0.0
  package_info_plus: ^8.0.3
  app_tracking_transparency:
  get:
  fluttertoast: ^8.2.4
  flutter_screenutil:
  gallery_saver_plus: ^3.2.9
  cached_network_image:
  carousel_slider: ^5.1.2
  google_fonts: ^6.2.1
  lottie: ^3.3.2
  flutter_image_compress: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.9

dependency_overrides:
  flutter_plugin_android_lifecycle: 2.0.26
  image_picker_android: 0.8.12+18
  shared_preferences_android: 2.3.4
  url_launcher_android: 6.3.14
  video_player_android: 2.7.15
  webview_flutter_android: 4.9.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/request.json
    - assets/gif/
    - assets/images/
    - assets/icons/

  module:
    androidX: true
    androidPackage: com.videodownloader.video_downloader
    iosBundleIdentifier: com.videodownloader.videoDownloader

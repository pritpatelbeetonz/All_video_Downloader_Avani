# JVM args — Compose builds + Kotlin K2 want a generous heap.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true

# Kotlin
kotlin.code.style=official
kotlin.jvm.target.validation.mode=warning

# Cross-drive workaround — project on F:, dependency cache on C:.
# Kotlin's incremental compiler can't relativize paths across drive roots.
# https://youtrack.jetbrains.com/issue/KT-65528
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false

# Suppress compileSdk 36 warning with AGP 8.7.3
android.suppressUnsupportedCompileSdk=36

